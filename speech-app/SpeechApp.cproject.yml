project:
  packs:
    - pack: ARM::CMSIS
    - pack: ARM::CMSIS-RTX@^5.9.1

  connections:
    - connect: SpeechApp runtime
      provides:
        - CMSIS-RTOS2
      consumes:
        - STDOUT
        - STDERR
        - SDS
        - SDSIO

  components:
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS:RTOS2:Keil RTX5&Source

  add-path:
    - ./src/feature_generation/include
    - ./src/feature_generation/src
    - ./src/feature_generation/generated
    - ./src/feature_generation/third_party/kissfft

  misc:
    - C:
        - -Dkiss_fft_scalar=float
    - for-compiler: GCC
      Link:
        - -Wl,-u,_printf_float

  groups:
    - group: App
      files:
        - file: ./src/app_main.cpp
        - file: ./src/arm_embedded_module.cpp
        - file: ./src/arm_embedded_module.hpp
    - group: Moonshine Audio Frontend
      files:
        - file: ./src/feature_generation/src/log_mel.cc
        - file: ./src/feature_generation/src/fft_scratch.cc
        - file: ./src/feature_generation/generated/mel_tables.cc
        - file: ./src/feature_generation/third_party/kissfft/kiss_fft.c
        - file: ./src/feature_generation/third_party/kissfft/kiss_fftr.c

  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI
    - layer: $SDSIO-Layer$
      type: SDSIO

  output:
    type:
      - elf
      - hex
      - map

